name: Update PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited

concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref_name }}'

jobs:
  pull-request:
    name: Pull Request
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
      repository-projects: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Update
        uses: ./.github/actions/pull-request/update
        with:
          environment: Preview
